name: ci
on:
  push: { branches: [main, windows-support] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Python deps
        run: python -m pip install libtorrent aiohttp cryptography pytest pytest-asyncio
      - name: Tests
        run: python -m pytest -q
      - name: UI typecheck and build
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: End-to-end (real processes, loopback)
        run: python scripts/e2e.py

  windows-package:
    name: package (windows)
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Python deps
        run: python -m pip install libtorrent aiohttp cryptography pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build portable app and installer
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          .\packaging\windows\build.ps1
      - name: Smoke test the portable build
        run: python scripts/smoke_exe.py dist/WebWays/WebWays.exe --verbose
      - name: Install silently, smoke test the installed copy, uninstall
        shell: powershell
        run: |
          $setup = Get-ChildItem dist-installer\WebWays-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "WebWaysInstalled"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\WebWays.exe")) { throw "installer did not install WebWays.exe" }
          python scripts/smoke_exe.py "$dir\WebWays.exe" --verbose
          if ($LASTEXITCODE -ne 0) { throw "smoke test of installed copy failed" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\WebWays.exe") { throw "uninstall left WebWays.exe behind" }
      - name: Checksums
        shell: powershell
        run: |
          Get-FileHash dist\*.zip, dist-installer\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: webways-windows-x64
          path: |
            dist/*.zip
            dist-installer/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
