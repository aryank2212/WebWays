[project]
name = "webways-indexer"
version = "0.3.1"
description = "Federated index node: signed listings, FTS search, operator moderation"
requires-python = ">=3.11"
dependencies = ["webways-protocol", "aiohttp>=3.9"]
license = { text = "AGPL-3.0-or-later" }

[project.scripts]
webways-indexer = "webways_indexer.cli:main"

[tool.setuptools]
packages = ["webways_indexer"]
