[project]
name = "swarm-indexer"
version = "0.2.0"
description = "Federated index node: signed listings, FTS search, operator moderation"
requires-python = ">=3.11"
dependencies = ["swarm-protocol", "aiohttp>=3.9"]
license = { text = "AGPL-3.0-or-later" }

[project.scripts]
swarm-indexer = "swarm_indexer.cli:main"

[tool.setuptools]
packages = ["swarm_indexer"]
