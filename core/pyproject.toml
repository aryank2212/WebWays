[project]
name = "webways-core"
version = "0.3.1"
description = "Torrent daemon (libtorrent) with local API and HTTP streaming"
requires-python = ">=3.11"
dependencies = ["webways-protocol", "aiohttp>=3.9", "libtorrent>=2.0"]
license = { text = "GPL-3.0-or-later" }

[project.scripts]
webways-core = "webways_core.cli:main"

[tool.setuptools]
packages = ["webways_core"]
